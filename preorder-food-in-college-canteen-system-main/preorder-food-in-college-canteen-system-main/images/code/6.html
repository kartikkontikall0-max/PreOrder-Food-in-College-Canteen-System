<!DOCTYPE html>
<html>
<body>

<input id="a" type="number" placeholder="1st"><br>
<input id="b" type="number" placeholder="2nd"><br>
<select id="op">
  <option value="+">+</option>
  <option value="-">-</option>
  <option value="*">*</option>
  <option value="/">/</option>
</select><br>
<button onclick="r.innerHTML=eval(a.value+op.value+b.value)">=</button>
<p id="r"></p>

</body>
</html>
