<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>
<style>
body{font-family:Arial;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.cal{width:260px;text-align:center}
input,select,button{width:100%;padding:8px;margin:6px 0}
button{background:#007bff;color:#fff;border:0;cursor:pointer}
#res{margin-top:10px;padding:10px;border:1px solid #ccc;border-radius:5px;display:none}
.err{background:#ffdddd;border-color:red}
.ok{background:#ddffdd;border-color:green}
</style>
</head>
<body>

<div class="cal">
<h1>Simple Calculator</h1>
<input type="number" id="a" placeholder="First number">
<input type="number" id="b" placeholder="Second number">
<select id="op">
<option value="">Operation</option>
<option value="sum">Sum</option>
<option value="mul">Product</option>
<option value="sub">Difference</option>
<option value="mod">Remainder</option>
<option value="div">Quotient</option>
<option value="pow">Power</option>
<option value="sqrt">Square Root</option>
<option value="sq">Square</option>
</select>
<button onclick="calc()">Go</button>
<div id="res"></div>
</div>

<script>
function calc(){
let x=parseFloat(a.value),y=parseFloat(b.value),o=op.value,r,c='ok';
if(isNaN(x)||isNaN(y)){r='Invalid numbers';c='err'}
else{
if(o=='sum')r=x+y;
else if(o=='mul')r=x*y;
else if(o=='sub')r=x-y;
else if(o=='mod')r=x%y;
else if(o=='div')r=y?x/y:(c='err','No /0');
else if(o=='pow')r=x**y;
else if(o=='sqrt')r='√${x}=${Math.sqrt(x)} , √${y}=${Math.sqrt(y)}';
else if(o=='sq')r='${x}²=${x*x} , ${y}²=${y*y}';
else{r='Pick operation';c='err'}
}
res.style.display="block";
res.className=c;
res.innerHTML=r;
}
</script>

</body>
</html>
