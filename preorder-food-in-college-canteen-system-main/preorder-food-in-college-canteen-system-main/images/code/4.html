<!DOCTYPE html>
<html>
<head>
<title>Form</title>
<style>
body{font-family:Arial;background:lightblue;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
form{background:white;padding:15px;border-radius:6px;width:260px}
label{font-size:13px}
input,select,textarea{width:100%;margin:4px 0 10px;padding:6px}
.gender{display:flex;gap:8px}
.btns{display:flex;gap:8px}
.btns input{color:white;border:0;cursor:pointer}
.sub{background:green}
.res{background:red}
</style>
</head>

<body>
<form>
<h3 style="text-align:center">Register</h3>
<label>First Name:</label>
<input required>
<label>Last Name:</label>
<input required>
<label>Email:</label>
<input type="email" required>
<label>Password:</label>
<input type="password" required>
<label>DOB:</label>
<input type="date">
<label>Gender:</label>
<div class="gender">
<input type="radio" name="g"><span>M</span>
<input type="radio" name="g"><span>F</span>
</div>
<label>Country:</label>
<select><option>USA</option><option>Canada</option><option>UK</option><option>India</option></select>
<label>Bio:</label>
<textarea rows="2"></textarea>
<div class="btns">
<input class="sub" type="submit" value="Submit">
<input class="res" type="reset" value="Reset">
</div>
</form>
</body>
</html>
