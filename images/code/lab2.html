<!DOCTYPE html>
<html>
<head>
<title>Timetable</title>
<style>
    body {font-family: Arial, sans-serif; text-align:center;}
    table {width:70%; margin:auto; border-collapse:collapse;}

    th {background:#ddd;}
    .red {background:#ffb3b3;}   /* Lab */

</head>
<body>

    </tr>
    <tr>
        <td>Wed</td><td>History</td><td>Comp Lab</td><td>Eng</td><td>Math</td>
    </tr>
    <tr>
        <td>Thu</td><td>PE</td><td>History</td><td>Geo</td><td class="green">Elective</td>
    </tr>
    <tr>
        <td>Fri</td><td>Bio Lab</td><td>Math</td><td>Eng</td><td>Phy</td>
    </tr>
    <tfoot><tr><td colspan="5">End of Timetable</td></tr></tfoot>
</table>

</body>
</html>
